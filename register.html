<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>College CRM — Register</title><style>body{font-family:Arial,sans-serif;background:#f6f5f1;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:28px;border-radius:18px;width:min(90%,360px);box-shadow:0 10px 35px #0001}h1{margin-top:0}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#2f5d50;color:white;font-weight:bold;margin-top:8px}.err{color:#c0392b;font-size:14px}a{color:#2f5d50}</style></head><body><div class="box"><h1>Create account</h1><p>Start your College CRM</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<form method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ characters)" required><button>Create account</button></form><p>Already registered? <a href="/login">Login</a></p></div></body></html>
