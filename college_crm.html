<body>
<button class="hamburger" id="hamBtn" onclick="toggleMenu()">☰</button><div class="dropdown" id="dropMenu"></div>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>

<script>
window.userEmail = {{ user_email|tojson }};
window.userName = {{ user_name|tojson }};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = d => d.toLocaleDateString('en-CA');
const todayStr = () => ymd(new Date());
const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); };
const nowHM = () => new Date().toTimeString().slice(0, 5);
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const daysFrom = d => Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 864e5);
const dow = d => new Date(d + 'T00:00:00').getDay();
const num = x => parseFloat(x) || 0;
const overallT = () => num(S.overallTarget) || 75;
const money = n => (n < 0 ? '-' : '') + '₹' + Math.round(Math.abs(num(n))).toLocaleString('en-IN');
const fmtMin = m => (m >= 60 ? Math.floor(m / 60) + 'h ' : '') + (m % 60 ? (m % 60) + 'm' : (m >= 60 ? '' : '0m'));
const inTag = d => { const n = daysFrom(d); return n < 0 ? `<span class="tag">${-n}d ago</span>` : n === 0 ? '<span class="tag warn">Today</span>' : n <= 3 ? `<span class="tag warn">in ${n}d</span>` : `<span class="tag">in ${n}d</span>`; };

/* ---------- defaults ---------- */
const DEF_SUBJECTS = [
  {id:'maths', name:'Maths', teacher:'Dr. Ritu'},
  {id:'mathstut', name:'Maths Tutorial', teacher:'Dr. Seema'},
  {id:'che', name:'Chemistry', teacher:'Dr. Simpi'},
  {id:'chetut', name:'Chemistry Tutorial', teacher:'Dr. Nisha'},
  {id:'bee', name:'BEE', teacher:'Ms. Mona Gaur'},
  {id:'wt', name:'WT', teacher:''},
  {id:'uhv', name:'UHV', teacher:'Ms. Vandana Kaushik'},
  {id:'mplab', name:'MP Lab', teacher:'Mr. KP Singh'},
  {id:'chelab', name:'Chemistry Lab', teacher:'Dr. Simpi'},
  {id:'dtlab', name:'DT Lab', teacher:'Dr. Abhi Bansal'},
  {id:'beelab', name:'BEE Lab', teacher:'Ms. Mona Gaur'}
].map(s => Object.assign({target: 65}, s));
const sl = (sub, s, e, note) => ({sub, s, e, note: note || ''});
const DEF_TT = {
  1: [sl('bee','09:00','10:00'), sl('maths','10:00','10:50'), sl('chetut','10:50','11:40'), sl('che','11:40','12:30'), sl('chelab','13:30','15:10')],
  2: [sl('che','09:00','10:00'), sl('bee','10:00','10:50'), sl('mplab','10:50','12:30'), sl('mathstut','13:30','14:20'), sl('maths','14:20','15:10')],
  3: [sl('bee','09:00','10:00'), sl('maths','10:00','10:50'), sl('uhv','10:50','11:40'), sl('che','11:40','12:30'), sl('mplab','13:30','15:10')],
  4: [sl('wt','09:00','10:00'), sl('maths','10:00','10:50'), sl('uhv','10:50','11:40'), sl('maths','11:40','12:30'), sl('dtlab','13:30','15:10')],
  5: [sl('maths','09:00','10:00'), sl('wt','10:00','10:50'), sl('bee','10:50','11:40'), sl('uhv','11:40','12:30'), sl('beelab','13:30','15:10')]
};
const DEF_HOL = [
  {name:'Milad un-Nabi', date:'2026-08-26'},
  {name:'Janmashtami', date:'2026-09-04'},
  {name:'Mahatma Gandhi Jayanti', date:'2026-10-02'},
  {name:'Dussehra', date:'2026-10-20'},
  {name:'Diwali', date:'2026-11-08'},
  {name:'Guru Nanak Jayanti', date:'2026-11-24'},
  {name:'Christmas', date:'2026-12-25'}
];
const LISTS = ['subjects','attendance','assignments','holidays','marks','exams','study','events','fees','sems','feeHeads','feePayments','feeInst','feeAdj','attSemesters','topics','notes','docs'];
let S = {timetable: null, start: ''};
LISTS.forEach(k => S[k] = []);
let tab = 'report', attDate = todayStr();
let calMonth = (() => { const d = new Date(); d.setDate(1); return d; })();
let bunkFrom = tomorrowStr(), bunkTo = tomorrowStr();
let dlApi = null;

function seed() {
  LISTS.forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
  if (!S.timetable) S.timetable = JSON.parse(JSON.stringify(DEF_TT));
  if (!S.fix3) {
    const mi = S.subjects.findIndex(x => x.id === 'maths');
    if (mi >= 0 && !S.subjects.find(x => x.id === 'mathstut')) S.subjects.splice(mi + 1, 0, {id: 'mathstut', name: 'Maths Tutorial', teacher: 'Dr. Seema', target: 65});
    Object.values(S.timetable).forEach(day => day.forEach(x => { if (x.sub === 'maths' && /Seema/.test(x.note || '')) { x.sub = 'mathstut'; x.note = ''; } }));
    S.fix3 = true;
  }
  if (!S.fix4) {
    const ci = S.subjects.findIndex(x => x.id === 'che');
    if (ci >= 0 && !S.subjects.find(x => x.id === 'chetut')) S.subjects.splice(ci + 1, 0, {id: 'chetut', name: 'Chemistry Tutorial', teacher: 'Dr. Nisha', target: 65});
    Object.values(S.timetable).forEach(day => day.forEach(x => { if (x.sub === 'che' && /Nisha/.test(x.note || '')) { x.sub = 'chetut'; x.note = ''; } }));
    S.fix4 = true;
  }
  DEF_SUBJECTS.forEach(d => { if (!S.subjects.find(s => s.id === d.id)) S.subjects.push(Object.assign({}, d)); });
  if (!S.holidays.length) S.holidays = DEF_HOL.map(h => Object.assign({id: uid()}, h));
  if (!S.assignments.length) S.assignments = [{id: uid(), title: 'Tripoli', subjectId: 'bee', due: '2026-09-30', done: false, priority: 'med', notes: '', link: ''}];
  if (!S.start) S.start = '2026-08-19';
  if (!S.fix1) {
    S.start = '2026-08-19';
    S.assignments.forEach(a => { if (a.title === 'Tripoli' && !a.subjectId) a.subjectId = 'bee'; });
    [{name:'Milad un-Nabi', date:'2026-08-26'}, {name:'Janmashtami', date:'2026-09-04'}].forEach(h => {
      if (!S.holidays.find(x => x.date === h.date)) S.holidays.push(Object.assign({id: uid()}, h));
    });
    S.fix1 = true;
  }
  if (!S.fix2) { S.subjects.forEach(s => { s.target = 65; }); S.overallTarget = 75; S.fix2 = true; }
  if (!S.overallTarget) S.overallTarget = 75;
  S.attendance = S.attendance.filter(r => r.slot != null);
}

/* ---------- real server storage ---------- */
let saveTimer = null;
async function loadLocal() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.data) S = Object.assign({timetable:null,start:''}, d.data);
  } catch (e) {}
}
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:S})}); } catch (e) {}
  }, 250);
}
function browserDownload(filename, blob) {
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- attendance engine ---------- */
const isHoliday = d => S.holidays.find(h => h.date === d);
const override = (d, i) => S.attendance.find(r => r.date === d && r.slot === i);
function counted(d, slot) { const t = todayStr(); return d < t || (d === t && nowHM() >= slot.e); }
function statusOf(d, i, slot) {
  const o = override(d, i);
  if (o) return o.status;
  if (isHoliday(d)) return '';
  return counted(d, slot) ? 'p' : '';
}
function stats(sub) {
  let Pn = 0, An = 0;
  if (S.timetable && S.start) {
    const d = new Date(S.start + 'T00:00:00'), end = new Date(todayStr() + 'T00:00:00');
    for (let n = 0; d <= end && n < 800; n++, d.setDate(d.getDate() + 1)) {
      const ds = ymd(d), w = d.getDay();
      if (w < 1 || w > 5) continue;
      (S.timetable[w] || []).forEach((slot, i) => {
        if (slot.sub !== sub.id) return;
        const st = statusOf(ds, i, slot);
        if (st === 'p') Pn++; else if (st === 'a') An++;
      });
    }
  }
  const total = Pn + An, pct = total ? Pn / total * 100 : null, t = sub.target || 65;
  let note = '';
  if (total) {
    if (pct >= t) {
      const skip = Math.floor(Pn / (t / 100) - total);
      note = skip > 0 ? `You can miss ${skip} more class${skip > 1 ? 'es' : ''} and stay at ${t}%` : `Right at your ${t}% target: don't miss the next one`;
    } else {
      const need = Math.ceil((t * total - 100 * Pn) / (100 - t));
      note = `Attend the next ${need} class${need > 1 ? 'es' : ''} in a row to reach ${t}%`;
    }
  }
  return {P: Pn, A: An, total, pct, t, note};
}
function rangeStats(start, end, subjectId) {
  let Pn = 0, An = 0;
  if (!S.timetable || !S.start) return {P: 0, A: 0, total: 0, pct: null};
  const lo = start < S.start ? S.start : start, td = todayStr(), hi = end > td ? td : end;
  if (lo > hi) return {P: 0, A: 0, total: 0, pct: null};
  const d = new Date(lo + 'T00:00:00'), e = new Date(hi + 'T00:00:00');
  for (let n = 0; d <= e && n < 800; n++, d.setDate(d.getDate() + 1)) {
    const ds = ymd(d), w = d.getDay();
    if (w < 1 || w > 5) continue;
    (S.timetable[w] || []).forEach((slot, i) => {
      if (subjectId && slot.sub !== subjectId) return;
      const st = statusOf(ds, i, slot);
      if (st === 'p') Pn++; else if (st === 'a') An++;
    });
  }
  const total = Pn + An;
  return {P: Pn, A: An, total, pct: total ? Pn / total * 100 : null};
}
function overall() {
  let Pn = 0, An = 0;
  S.subjects.forEach(s => { const st = stats(s); Pn += st.P; An += st.A; });
  return {P: Pn, A: An, total: Pn + An, pct: Pn + An ? Pn / (Pn + An) * 100 : null};
}
function overallNote() {
  const o = overall(), t = overallT();
  if (!o.total) return '';
  if (o.pct >= t) { const skip = Math.floor(o.P / (t / 100) - o.total); return skip > 0 ? `You can miss ${skip} more class${skip > 1 ? 'es' : ''} overall and stay at ${t}%` : `Right at the overall ${t}% line`; }
  const need = Math.ceil((t * o.total - 100 * o.P) / (100 - t));
  return `Attend the next ${need} class${need > 1 ? 'es' : ''} in a row to reach the overall ${t}%`;
}
const colorFor = (pct, t) => pct == null ? 'var(--mute)' : pct >= t + 5 ? 'var(--good)' : pct >= t ? 'var(--warn)' : 'var(--bad)';
const subOf = id => S.subjects.find(s => s.id === id) || {name: 'General'};
const subOpts = (sel, general) => (general ? `<option value="">General</option>` : '') + S.subjects.map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');

function warnHtml() {
  let h = '';
  const o = overall(), ot = overallT();
  if (o.pct != null) {
    if (o.pct < ot) h += `<div class="banner bad">⚠️ Overall attendance ${o.pct.toFixed(1)}% is below the ${ot}% requirement</div>`;
    else if (o.pct < ot + 3) h += `<div class="banner">⚡ Overall attendance ${o.pct.toFixed(1)}% is close to the ${ot}% requirement</div>`;
  }
  S.subjects.forEach(s => {
    const st = stats(s);
    if (st.pct == null) return;
    if (st.pct < st.t) h += `<div class="banner bad">⚠️ ${esc(s.name)}: ${st.pct.toFixed(0)}% is below your ${st.t}% target</div>`;
    else if (st.pct < st.t + 3) h += `<div class="banner">⚡ ${esc(s.name)}: ${st.pct.toFixed(0)}% is close to your ${st.t}% target</div>`;
  });
  return h;
}

/* ---------- marks / SGPA ---------- */
function marksPct(id) {
  const m = S.marks.filter(x => x.subjectId === id);
  const mx = m.reduce((a, x) => a + x.max, 0), got = m.reduce((a, x) => a + x.got, 0);
  return mx ? got / mx * 100 : null;
}
function gpFor(s) {
  if (s.gp !== '' && s.gp != null) return {v: +s.gp, est: false};
  const p = marksPct(s.id);
  return p == null ? null : {v: Math.min(10, Math.round(p) / 10), est: true};
}
function sgpa() {
  let num = 0, den = 0;
  S.subjects.forEach(s => {
    const c = +s.credits || 0, g = gpFor(s);
    if (c > 0 && g) { num += c * g.v; den += c; }
  });
  return den ? {val: num / den, credits: den} : null;
}
function cgpa() {
  const cur = sgpa();
  let num = 0, den = 0;
  S.sems.forEach(x => { num += x.sgpa * x.credits; den += x.credits; });
  if (cur) { num += cur.val * cur.credits; den += cur.credits; }
  return den ? num / den : null;
}

/* ---------- views ---------- */
function backBtn() { return `<button class="ghost" style="margin-bottom:8px" onclick="go('more')">‹ More</button>`; }

function reportView() {
  const o = overall(), sg = sgpa();
  const done = S.assignments.filter(a => a.done).length, tot = S.assignments.length;
  const overdue = S.assignments.filter(a => !a.done && daysFrom(a.due) < 0).length;
  const pend = S.assignments.filter(a => !a.done).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5);
  const hol = S.holidays.filter(h => daysFrom(h.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
  const exams = S.exams.filter(x => daysFrom(x.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const evs = S.events.filter(x => daysFrom(x.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const fees = S.fees.filter(x => !x.paid).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
  const td = todayStr(), w = dow(td), todays = (S.timetable && S.timetable[w]) || [];
  let h = `<h1>My report</h1><p class="sub">${new Date().toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>`;
  h += `<div class="grid">

  else if (w < 1 || w > 5) h += `<div class="card empty">Weekend, no classes 🎉</div>`;

    const st = statusOf(td, i, s);
    const tag = st === 'p' ? '<span class="tag good">present</span>' : st === 'a' ? '<span class="tag bad">absent</span>' : st === 'o' ? '<span class="tag">no class</span>' : '<span class="tag warn">upcoming</span>';

  h += `<h2>Attendance by subject</h2>`;

  h += `<h2>Upcoming deadlines</h2>`;

  if (evs.length) h += `<h2>Talks & events</h2>` + evs.map(x => `<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${fmt(x.date)}${x.time ? ' · ' + esc(x.time) : ''}${x.place ? ' · ' + esc(x.place) : ''}</div></div>${inTag(x.date)}</div>`).join('');
  if (fees.length) h += `<h2>Forms & other dues</h2>` + fees.map(x => `<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${x.amount ? esc(x.amount) + ' · ' : ''}due ${fmt(x.due)}</div></div>${inTag(x.due)}</div>`).join('');
  h += `<h2>Next holidays</h2>`;
  h += hol.length ? hol.map(x => `<div class="card row"><div class="grow"><b>${esc(x.name)}</b><div class="mute">${fmt(x.date)}</div></div>${inTag(x.date)}</div>`).join('') : `<div class="card empty">No upcoming holidays added</div>`;

}

  h += `<div class="row" style="margin-bottom:10px"><button class="ghost" onclick="shiftDate(-1)">‹</button><input type="date" id="attDate" value="${attDate}" onchange="attDate=this.value;render()"><button class="ghost" onclick="shiftDate(1)">›</button></div>`;

function assignmentsView() {

  const rank = {high: 0, med: 1, low: 2};
  const list = [...S.assignments].sort((a, b) => (a.done - b.done) || a.due.localeCompare(b.due) || (rank[a.priority || 'med'] - rank[b.priority || 'med']));

function calendarView() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, td = todayStr();
  let h = backBtn() + `<h1>Attendance calendar</h1><div class="row" style="margin:8px 0"><button class="ghost" onclick="shiftMonth(-1)">‹</button><b class="grow" style="text-align:center">${first.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</b><button class="ghost" onclick="shiftMonth(1)">›</button></div><div class="cal">`;
  ['M','T','W','T','F','S','S'].forEach(x => h += `<div class="h">${x}</div>`);
  for (let i = 0; i < lead; i++) h += `<button class="blank"></button>`;
  for (let d = 1; d <= days; d++) {
    const ds = ymd(new Date(y, m, d)), w = dow(ds);
    let cls = '', label = d;
    if (w === 0 || w === 6 || ds < S.start) cls = 'off';
    else if (isHoliday(ds)) cls = 'hol';
    else {
      const slots = S.timetable[w] || [];
      const cn = slots.map((s, i) => ({s, i})).filter(x => counted(ds, x.s));
      if (cn.length) {
        const ab = cn.filter(x => statusOf(ds, x.i, x.s) === 'a').length;
        if (ab) { cls = 'abs'; label = `${d}<div style="font-size:9px">−${ab}</div>`; } else cls = 'pre';
      }
    }
    h += `<button class="${cls} ${ds === td ? 'today' : ''}" onclick="attDate='${ds}';go('attendance')">${label}</button>`;
  }
  h += `</div><div class="legend small"><span><i class="dot" style="background:color-mix(in srgb,var(--good) 40%,transparent)"></i>All present</span><span><i class="dot" style="background:var(--bad)"></i>Absent (−classes)</span><span><i class="dot" style="background:color-mix(in srgb,var(--warn) 45%,transparent)"></i>Holiday</span></div><p class="small">Tap a day to open it in Attendance.</p>`;
  return h;
}

function bunkView() {
  let from = bunkFrom < tomorrowStr() ? tomorrowStr() : bunkFrom, to = bunkTo < from ? from : bunkTo;
  const skip = {};
  let cnt = 0;
  const d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00');
  for (let n = 0; d <= end && n < 400; n++, d.setDate(d.getDate() + 1)) {
    const ds = ymd(d), w = d.getDay();
    if (w < 1 || w > 5 || isHoliday(ds)) continue;
    (S.timetable[w] || []).forEach(s => { skip[s.sub] = (skip[s.sub] || 0) + 1; cnt++; });
  }
  let h = backBtn() + `<h1>Bunk planner</h1><p class="sub">Pick your leave dates to see how attendance would change if you skip every class in that range.</p>
  <div class="card form"><div class="two"><div><span class="small">From</span><input type="date" min="${tomorrowStr()}" value="${from}" onchange="bunkFrom=this.value;render()"></div><div><span class="small">To</span><input type="date" min="${from}" value="${to}" onchange="bunkTo=this.value;render()"></div></div></div>`;
  if (!cnt) return h + `<div class="card empty">No classes in that range (weekend or holiday).</div>`;
  const o = overall(), newO = o.P / (o.total + cnt) * 100;
  h += `<div class="card"><div class="row"><div class="grow"><b>Overall</b><div class="mute">${cnt} classes skipped</div></div><span class="mute">${o.pct == null ? '—' : o.pct.toFixed(1) + '%'} →</span><b style="color:${colorFor(newO, overallT())}">${newO.toFixed(1)}%</b></div></div>`;
  S.subjects.filter(s => skip[s.id]).forEach(s => {
    const st = stats(s), np = st.P / (st.total + skip[s.id]) * 100;
    h += `<div class="card row"><div class="grow"><b>${esc(s.name)}</b><div class="mute">skip ${skip[s.id]} class${skip[s.id] > 1 ? 'es' : ''} · target ${st.t}%</div></div><span class="mute">${st.pct == null ? '—' : st.pct.toFixed(0) + '%'} →</span><b style="color:${colorFor(np, st.t)}">${np.toFixed(0)}%</b>${np < st.t ? '<span class="tag bad">below target</span>' : ''}</div>`;
  });
  return h + `<p class="small">Based on your record so far.</p>`;
}

function monthsList() {

}
function monthRange(k) {

}
function subjRows(start, end) {

function feeTotals() {
  const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
  const total = sum(S.feeHeads, h => h.total);
  const fines = sum(S.feeAdj.filter(a => a.kind === 'fine'), a => a.amount);
  const waived = sum(S.feeAdj.filter(a => a.kind === 'scholarship'), a => a.amount);
  const refunds = sum(S.feeAdj.filter(a => a.kind === 'refund'), a => a.amount);
  const paid = sum(S.feePayments, p => p.amount) - refunds;
  const payable = total + fines - waived;
  return {total, fines, waived, refunds, paid, payable, remaining: payable - paid};
}
function feeDue() {
  const open = S.feeInst.filter(i => !i.paid).sort((a, b) => a.due.localeCompare(b.due));
  const overdue = open.filter(i => daysFrom(i.due) < 0);
  return {open, overdue, overdueAmt: overdue.reduce((a, i) => a + num(i.amount), 0), next: open.find(i => daysFrom(i.due) >= 0)};
}

  try {
    let rows = [['Date', 'Day', 'Subject', 'Status']];
    const d = new Date(S.start + 'T00:00:00'), end = new Date(todayStr() + 'T00:00:00');
    for (let n = 0; d <= end && n < 800; n++, d.setDate(d.getDate() + 1)) {
      const ds = ymd(d), w = d.getDay();
      if (w < 1 || w > 5) continue;
      (S.timetable[w] || []).forEach((slot, i) => {
        const st = statusOf(ds, i, slot);
        if (!st) return;
        rows.push([ds, ['', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][w], subOf(slot.sub).name, st === 'p' ? 'Present' : st === 'a' ? 'Absent' : 'No class']);
      });
    }
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type: 'text/csv'});
    browserDownload('attendance.csv', blob);
  } catch (e) {}
}
function setSlot(day, idx, field, val) { const s = S.timetable[day][idx]; if (!s) return; s[field] = val; persist(); render(); }
function addSlot(day) { S.timetable[day] = S.timetable[day] || []; S.timetable[day].push({sub: S.subjects[0] ? S.subjects[0].id : '', s: '09:00', e: '10:00', note: ''}); persist(); render(); }
function removeSlot(day, idx) { S.timetable[day].splice(idx, 1); persist(); render(); }
function previewSgpa() {
  const subId = $('#gpSub').value, got = parseFloat($('#gpGot').value), max = parseFloat($('#gpMax').value);
  if (!subId || isNaN(got) || isNaN(max) || max <= 0) { gpPreview = null; render(); return; }
  const cur = S.marks.filter(m => m.subjectId === subId);
  const mx = cur.reduce((a, x) => a + x.max, 0) + max, gotT = cur.reduce((a, x) => a + x.got, 0) + got;
  const pct = gotT / mx * 100, gp = Math.min(10, Math.round(pct) / 10);
  let num = 0, den = 0;
  S.subjects.forEach(s => {
    const c = +s.credits || 0; if (!c) return;
    const g = s.id === subId ? gp : (gpFor(s) ? gpFor(s).v : null);
    if (g == null) return;
    num += c * g; den += c;
  });
  gpPreview = {name: subOf(subId).name, pct, gp, sgpa: den ? num / den : null};
  render();
}
function syllabusView() {
  let h = backBtn() + `<h1>Syllabus & notes</h1><p class="sub">Track topics covered and jot quick notes per subject.</p>
  <div class="seg" style="margin:0 0 12px"><button class="p ${sylTab === 'topics' ? 'on' : ''}" onclick="sylTab='topics';render()">Topics</button><button class="p ${sylTab === 'notes' ? 'on' : ''}" onclick="sylTab='notes';render()">Notes</button></div>`;
  if (sylTab === 'topics') {
    h += `<div class="card form"><select id="tpSub">${subOpts('', false)}</select><input id="tpTitle" placeholder="Topic (e.g. Fourier series)"><button class="btn" onclick="addTopic()">Add topic</button></div>`;
    if (!S.subjects.length) return h + `<div class="empty">Add subjects first</div>`;
    let any = false;
    S.subjects.forEach(s => {
      const list = S.topics.filter(t => t.subjectId === s.id);
      if (!list.length) return;
      any = true;
      const done = list.filter(t => t.done).length;
      h += `<div class="card"><div class="row"><b class="grow">${esc(s.name)}</b><span class="mute">${done}/${list.length}</span></div>`;
      list.forEach(t => h += `<div class="row" style="padding:3px 0"><button class="chk ${t.done ? 'on' : ''}" onclick="toggleTopic('${t.id}')">${t.done ? '✓' : ''}</button><span class="grow" style="${t.done ? 'text-decoration:line-through;color:var(--mute)' : ''}">${esc(t.title)}</span><button class="x" onclick="delItem('topics','${t.id}')">✕</button></div>`);
      h += `</div>`;
    });
    if (!any) h += `<div class="empty">No topics added yet</div>`;
    return h;
  }
  h += `<div class="card form"><select id="ntSub">${subOpts('', true)}</select><input id="ntText" placeholder="Quick note"><button class="btn" onclick="addNote()">Add note</button></div>`;
  const list = [...S.notes].sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) return h + `<div class="empty">No notes yet</div>`;
  list.forEach(n => h += `<div class="card row"><div class="grow"><b>${esc(subOf(n.subjectId).name)}</b><div class="mute">${fmt(n.date)}</div><div style="margin-top:4px">${esc(n.text)}</div></div><button class="x" onclick="delItem('notes','${n.id}')">✕</button></div>`);
  return h;
}
function addTopic() { const title = $('#tpTitle').value.trim(); if (!title) return; addItem('topics', {subjectId: $('#tpSub').value, title, done: false}); }
function toggleTopic(id) { const t = S.topics.find(x => x.id === id); if (t) t.done = !t.done; persist(); render(); }
function addNote() { const text = $('#ntText').value.trim(); if (!text) return; addItem('notes', {subjectId: $('#ntSub').value, text, date: todayStr()}); }
function vaultView() {
  let h = backBtn() + `<h1>Document vault</h1><p class="sub">Save receipt numbers, form numbers or IDs. Please don't store card or bank account numbers here.</p>
  <div class="card form"><input id="dvTitle" placeholder="Title (e.g. Library card no.)"><input id="dvValue" placeholder="Value"><input id="dvNote" placeholder="Note (optional)"><button class="btn" onclick="addDoc()">Add</button></div>`;
  if (!S.docs.length) return h + `<div class="empty">Nothing saved yet</div>`;
  S.docs.forEach(x => h += `<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${esc(x.value)}${x.note ? ' · ' + esc(x.note) : ''}</div></div><button class="x" onclick="delItem('docs','${x.id}')">✕</button></div>`);
  return h;
}
function addDoc() { const title = $('#dvTitle').value.trim(), value = $('#dvValue').value.trim(); if (!title || !value) return; addItem('docs', {title, value, note: $('#dvNote').value.trim()}); }
function searchView() {
  let h = backBtn() + `<h1>Search</h1><div class="row" style="margin-bottom:12px"><input id="srQ" placeholder="Search everything…" value="${esc(searchQ)}"><button class="btn" onclick="searchQ=$('#srQ').value;render()">Go</button></div>`;
  const q = searchQ.trim().toLowerCase();
  if (!q) return h + `<div class="card empty">Search assignments, exams, fees, notes, topics and the document vault</div>`;
  const hits = [];
  S.assignments.forEach(a => a.title.toLowerCase().includes(q) && hits.push(['assignments', '📝', a.title, fmt(a.due)]));
  S.exams.forEach(x => x.title.toLowerCase().includes(q) && hits.push(['exams', '📅', x.title, fmt(x.date)]));
  S.events.forEach(x => x.title.toLowerCase().includes(q) && hits.push(['events', '🎤', x.title, fmt(x.date)]));
  S.fees.forEach(x => x.title.toLowerCase().includes(q) && hits.push(['fees', '💳', x.title, fmt(x.due)]));
  S.notes.forEach(x => x.text.toLowerCase().includes(q) && hits.push(['syllabus', '🗒️', x.text, fmt(x.date)]));
  S.topics.forEach(x => x.title.toLowerCase().includes(q) && hits.push(['syllabus', '📓', x.title, subOf(x.subjectId).name]));
  S.docs.forEach(x => (x.title + ' ' + x.value).toLowerCase().includes(q) && hits.push(['vault', '🗂️', x.title, x.value]));
  if (!hits.length) return h + `<div class="card empty">No matches for "${esc(searchQ)}"</div>`;
  hits.forEach(([dest, ic, t, sub]) => h += `<button class="menu" onclick="go('${dest}')"><span class="ic">${ic}</span><span class="grow"><b>${esc(t)}</b><div class="mute">${esc(sub)}</div></span></button>`);
  return h;
}

/* ---------- actions ---------- */
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
function shiftDate(n) { const d = new Date(attDate + 'T00:00:00'); d.setDate(d.getDate() + n); attDate = ymd(d); render(); }
function shiftMonth(n) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1); render(); }
function mark(i, status) {
  const idx = S.attendance.findIndex(r => r.date === attDate && r.slot === i);
  if (status === 'p') { if (idx >= 0) S.attendance.splice(idx, 1); }
  else if (idx >= 0 && S.attendance[idx].status === status) S.attendance.splice(idx, 1);
  else if (idx >= 0) S.attendance[idx].status = status;
  else S.attendance.push({date: attDate, slot: i, status});
  persist(); render();
}
function delItem(key, id) { S[key] = S[key].filter(x => x.id !== id); persist(); render(); }
function addItem(key, obj) { S[key].push(Object.assign({id: uid()}, obj)); persist(); render(); }
function setOverallT(v) { const n = parseFloat(v); S.overallTarget = isNaN(n) || n < 1 || n > 100 ? 75 : n; persist(); render(); }
function setSub(id, k, v) {
  const s = S.subjects.find(x => x.id === id); if (!s) return;
  const n = parseFloat(v);
  s[k] = isNaN(n) ? (k === 'target' ? 65 : '') : n;
  persist(); render();
}
function addAssignment() {
  const title = $('#aTitle').value.trim(); if (!title) return;
  addItem('assignments', {title, subjectId: $('#aSub').value, due: $('#aDue').value || todayStr(), done: false, priority: $('#aPri').value, notes: $('#aNotes').value.trim(), link: $('#aLink').value.trim()});
}
function toggleA(id) { const a = S.assignments.find(x => x.id === id); if (a) a.done = !a.done; persist(); render(); }
function toggleFee(id) { const a = S.fees.find(x => x.id === id); if (a) a.paid = !a.paid; persist(); render(); }
function addHoliday() {
  const name = $('#hName').value.trim(); if (!name) return;
  addItem('holidays', {name, date: $('#hDate').value || todayStr()});
}
function addMark() {
  const exam = $('#mExam').value.trim(), got = parseFloat($('#mGot').value), max = parseFloat($('#mMax').value);
  if (!exam || isNaN(got) || isNaN(max) || max <= 0) return;
  addItem('marks', {subjectId: $('#mSub').value, exam, got, max});
}
function addSem() {
  const name = $('#sName').value.trim(), sg = parseFloat($('#sSg').value), cr = parseFloat($('#sCr').value);
  if (!name || isNaN(sg) || isNaN(cr) || cr <= 0) return;
  addItem('sems', {name, sgpa: sg, credits: cr});
}
function addExam() {
  const title = $('#xTitle').value.trim(); if (!title) return;
  addItem('exams', {title, subjectId: $('#xSub').value, date: $('#xDate').value || todayStr(), time: $('#xTime').value});
}
function addStudy() {
  const mins = parseInt($('#stMin').value); if (!mins || mins < 1) return;
  addItem('study', {subjectId: $('#stSub').value, mins, date: $('#stDate').value || todayStr(), note: $('#stNote').value.trim()});
}
function addEvent() {
  const title = $('#eTitle').value.trim(); if (!title) return;
  addItem('events', {title, date: $('#eDate').value || todayStr(), time: $('#eTime').value, place: $('#ePlace').value.trim(), note: $('#eNote').value.trim()});
}
function addFee() {
  const title = $('#fTitle').value.trim(); if (!title) return;
  addItem('fees', {title, amount: $('#fAmt').value.trim(), due: $('#fDue').value || todayStr(), paid: false});
}

/* ---------- PDF report ---------- */
async function makePdf() {
  try {
    const A = s => String(s == null ? '' : s).replace(/[^\x20-\x7E]/g, '-');
    const doc = new window.jspdf.jsPDF({unit: 'pt', format: 'a4'});
    let y = 50;
    const need = n => { if (y + n > 800) { doc.addPage(); y = 50; } };
    const text = (t, size, bold, x) => { need(size + 8); doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.text(A(t), x || 40, y); y += size + 6; };
    const cols = (arr, xs, bold) => { need(18); doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(10); arr.forEach((t, i) => doc.text(A(t), xs[i], y)); y += 16; };
    const head = t => { y += 8; text(t, 13, true); };
    const o = overall(), sg = sgpa();
    text('College Report', 20, true);
    text(new Date().toDateString() + '  |  attendance counted from ' + S.start, 10, false);
    y += 4;
    text('Overall attendance: ' + (o.pct == null ? '-' : o.pct.toFixed(1) + '%') + '  (' + o.P + ' of ' + o.total + ' classes, overall target ' + overallT() + '%)', 11, false);
    if (sg) text('SGPA (estimate): ' + sg.val.toFixed(2) + '   CGPA: ' + (cgpa() || 0).toFixed(2), 11, false);
    head('Attendance by subject');
    const xs = [40, 210, 270, 330, 400];
    cols(['Subject', 'Present', 'Absent', 'Percent', 'Target'], xs, true);
    S.subjects.forEach(s => { const st = stats(s); cols([s.name, st.P, st.A, st.pct == null ? '-' : st.pct.toFixed(1) + '%', st.t + '%'], xs); });
    head('Assignments');
    if (!S.assignments.length) text('None', 10, false);
    S.assignments.forEach(a => cols([a.title, subOf(a.subjectId).name, a.due, a.done ? 'Submitted' : 'Pending'], [40, 210, 320, 410]));
    if (S.marks.length) {
      head('Marks');
      S.subjects.filter(s => S.marks.some(m => m.subjectId === s.id)).forEach(s => {
        cols([s.name, marksPct(s.id).toFixed(1) + '%'], [40, 210], true);
        S.marks.filter(m => m.subjectId === s.id).forEach(m => cols(['   ' + m.exam, m.got + ' / ' + m.max], [40, 210]));
      });
    }
    if (S.feeHeads.length || S.feePayments.length) {
      const ft = feeTotals(), R = n => 'Rs. ' + Math.round(num(n)).toLocaleString('en-IN');
      head('Fees');
      text('Total payable: ' + R(ft.payable) + '   Paid: ' + R(ft.paid) + '   ' + (ft.remaining < 0 ? 'Overpaid: ' : 'Remaining: ') + R(Math.abs(ft.remaining)), 11, false);
      if (S.feeHeads.length) {
        cols(['Fee head', 'Total', 'Paid', 'Remaining'], [40, 210, 300, 390], true);
        S.feeHeads.forEach(x => { const pd = S.feePayments.filter(p => p.headId === x.id).reduce((a, p) => a + num(p.amount), 0); cols([x.name, R(x.total), R(pd), R(num(x.total) - pd)], [40, 210, 300, 390]); });
      }
      const up = S.feeInst.filter(i => !i.paid).sort((a, b) => a.due.localeCompare(b.due));
      if (up.length) { text('Pending instalments', 11, true); up.forEach(i => cols([headName(i.headId), R(i.amount), i.due], [40, 210, 300])); }
      if (S.feePayments.length) { text('Payments', 11, true); [...S.feePayments].sort((a, b) => b.date.localeCompare(a.date)).forEach(p => cols([p.date, headName(p.headId), R(p.amount), p.mode || '', p.receipt ? '#' + p.receipt : ''], [40, 110, 250, 340, 420])); }
    }
    const ex = S.exams.filter(x => daysFrom(x.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    if (ex.length) { head('Upcoming exams'); ex.forEach(x => cols([x.title, subOf(x.subjectId).name, x.date, x.time || ''], [40, 210, 320, 410])); }
    const fe = S.fees.filter(x => !x.paid);
    if (fe.length) { head('Forms and other dues'); fe.forEach(x => cols([x.title, x.amount || '', x.due], [40, 210, 320])); }
    const ho = S.holidays.filter(h => daysFrom(h.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    if (ho.length) { head('Upcoming holidays'); ho.forEach(x => cols([x.name, x.date], [40, 210])); }
    browserDownload('college-report.pdf', doc.output('blob'));
  } catch (e) { /* declined or unavailable */ }
}

/* ---------- shell ---------- */
const MAIN = [['report', '📊', 'Report'], ['attendance', '✅', 'Attendance'], ['assignments', '📝', 'Tasks'], ['marks', '🎯', 'Marks']];
function logout(){ window.location.href='/logout'; }
function toggleMenu() { menuOpen = !menuOpen; renderMenu(); }
function selectMenu(k) { menuOpen = false; go(k); }
function renderMenu() {
  const d = $('#dropMenu');
  d.className = 'dropdown' + (menuOpen ? ' open' : '');
  d.innerHTML = MORE.map(m => `<button onclick="selectMenu('${m[0]}')"><span class="ic">${m[1]}</span><span>${m[2]}</span></button>`).join('') + (window.userEmail ? `<button onclick="menuOpen=false;logout()"><span class="ic">🚪</span><span>Log out</span></button>` : '');
}
function render() {
  const views = {report: reportView, attendance: attendanceView, assignments: assignmentsView, marks: marksView, more: moreView, calendar: calendarView, bunk: bunkView, exams: examsView, study: studyView, events: eventsView, fees: feesView, holidays: holidaysView, setup: setupView, monthly: monthlyView, syllabus: syllabusView, vault: vaultView, search: searchView};
  $('#app').innerHTML = views[tab]();
  $('#nav').innerHTML = MAIN.map(t => `<button class="${tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
  renderMenu();
}
(async function bootstrap(){
  await loadLocal();
  seed();
  applyTheme();
  render();
  persist();
})();
</script>
